name: MUSLIM DNS DOMAIN BUILD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o muslim-dns-amd64 ./cmd/registry-server
      - name: Build Linux ARMv7
        run: GOOS=linux GOARCH=arm GOARM=7 go build -o muslim-dns-armv7 ./cmd/registry-server
      - uses: actions/upload-artifact@v4
        with:
          name: MUSLIM-DNS-DOMAIN-BUILD
          path: muslim-dns-*
